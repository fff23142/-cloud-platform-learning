version: "3.8"

# ============================================
# 学习项目基础设施 — 一键启动所有中间件
# 使用: docker-compose up -d
# ============================================

services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: learn-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./docker/nacos/logs:/home/nacos/logs

  mysql:
    image: mysql:8.0
    container_name: learn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: learn-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123

  minio:
    image: minio/minio:latest
    container_name: learn-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/minio/data:/data
    command: server /data --console-address ":9001"

  seata:
    image: seataio/seata-server:1.8.0
    container_name: learn-seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_PORT: 8091
    volumes:
      - ./docker/seata/resources:/seata-server/resources

  prometheus:
    image: prom/prometheus:latest
    container_name: learn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: learn-grafana
    ports:
      - "3000:3000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: learn-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: learn-logstash
    ports:
      - "5044:5044"
    volumes:
      - ./docker/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: learn-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://learn-es:9200
