# ====== 网关配置 ======
# 网关就是一个"大门"：浏览器只访问 8080 端口
# 网关根据 URL 路径自动转发到对应的微服务
#
# 比如：
#   http://localhost:8080/user/1    → 转发到 service-user (8091) 的 /user/1
#   http://localhost:8080/order/1   → 转发到 service-order (8092) 的 /order/1

spring:
  application:
    name: cloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
      config:
        import-check:
          enabled: false
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
        # 去掉上游服务重复加的 CORS 头，只保留网关加的一份
      routes:
        - id: user-route          # 路由名称，随便起
          uri: lb://service-user   # lb:// = 从 Nacos 取 service-user 的地址，自动负载均衡
          predicates:
            - Path=/user/**        # 所有 /user/ 开头的请求都走这条

        - id: order-route
          uri: lb://service-order
          predicates:
            - Path=/order/**

        - id: auth-route
          uri: lb://cloud-auth     # 登录接口转发到认证服务
          predicates:
            - Path=/auth/**

  sentinel:
    transport:
      port: 8719                # Sentinel 内部通信端口
    scg:
      fallback:
        mode: response          # 被限流时直接返回响应
        response-status: 429    # HTTP 429 Too Many Requests
        response-body: '{"code":429,"message":"请求太频繁，请稍后再试"}'

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8080

# JWT 密钥
auth:
  jwt:
    secret: ThisIsASecretKeyForLearningMinLength32
