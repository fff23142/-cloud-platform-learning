spring:
  application:
    name: service-user
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    dynamic:
      primary: master            # 默认走主库（写操作）
      strict: false              # 找不到匹配数据源时退回到主库
      datasource:
        master:                  # 主库 — INSERT / UPDATE / DELETE
          url: jdbc:mysql://127.0.0.1:3306/learn_user?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
        slave:                   # 从库 — SELECT（暂时同库模拟，生产环境换成只读副本地址）
          url: jdbc:mysql://127.0.0.1:3306/learn_user?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379

redisson:
  config: |
    singleServerConfig:
      address: "redis://127.0.0.1:6379"
      connectionMinimumIdleSize: 1
      connectionPoolSize: 2

seata:
  tx-service-group: learn-group
  service:
    vgroup-mapping:
      learn-group: default
    grouplist:
      default: 127.0.0.1:8191

# PowerJob Worker 配 置 — 接入分布调式度务器
powerjob:
  worker:
    enabled: true
    server-address: 127.0.0.1:7700
    app-name: learn-app
    protocol: http
    store-strategy: disk
    max-result-length: 4096
    max-appended-wf-context-length: 4096
    max-lightweight-task-num: 1024
    max-heavyweight-task-num: 64

server:
  port: 8091

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
