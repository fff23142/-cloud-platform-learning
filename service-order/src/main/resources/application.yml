spring:
  application:
    name: service-order
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/learn_user?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

liteflow:
  rule-source: liteflow/flow.xml           # 流程定义文件路径

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8092

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted

seata:
  tx-service-group: learn-group          # 事务分组名，对应 seata-server 配置
  service:
    vgroup-mapping:
      learn-group: default               # 映射到 default 集群
    grouplist:
      default: 127.0.0.1:8191            # Seata Server 地址
