# ====== 认证服务配置 ======
# 负责用户登录、验证密码、签发 JWT Token

spring:
  application:
    name: cloud-auth
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/learn_user?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 8081

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    secret: ThisIsASecretKeyForLearningMinLength32
    expiration: 7200000
